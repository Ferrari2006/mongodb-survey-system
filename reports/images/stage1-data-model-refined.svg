<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="738" viewBox="0 0 1200 738" role="img" aria-labelledby="title desc">
<title id="title">问卷系统的五个 MongoDB 集合及题目嵌入结构</title>
<desc id="desc">users 通过 owner_id 关联 surveys，通过 user_id 关联 sessions。surveys 内嵌 questions 数组，包含选项、校验和跳转规则。fill_progress 和 responses 引用 survey_id 与 user_id，前者保存已确认进度但不计统计，后者保存正式答卷并用于统计。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#506575"/></marker></defs>
<g font-family="Microsoft YaHei, SimHei, sans-serif"><rect width="1200" height="738" rx="12" fill="white"/>
<text x="32" y="45" font-size="32" fill="#183449" font-weight="700" >问卷系统的五个集合</text>
<text x="32" y="81" font-size="22" fill="#506575" font-weight="400" >题目随问卷读取；进度与正式答卷独立保存</text>
<rect x="32" y="114" width="300" height="178" rx="10" fill="#FFFFFF" stroke="#C7D5DE" stroke-width="1.5"/>
<path d="M33 124Q33 115 42 115H322Q331 115 331 124V171H33Z" fill="#F2F7F9"/>
<text x="52" y="150" font-size="27" fill="#183449" font-weight="700" >users</text>
<text x="314" y="149" font-size="20" fill="#506575" font-weight="400" text-anchor="end">账号</text>
<text x="52" y="207" font-size="20" fill="#183449" font-weight="400" >username / password_hash</text>
<text x="52" y="246" font-size="22" fill="#183449" font-weight="400" >created_at</text>
<text x="52" y="277" font-size="20" fill="#506575" font-weight="400" >密码以哈希保存</text>
<rect x="490" y="114" width="678" height="282" rx="10" fill="#FFFFFF" stroke="#C7D5DE" stroke-width="1.5"/>
<path d="M491 124Q491 115 500 115H1158Q1167 115 1167 124V171H491Z" fill="#F2F7F9"/>
<text x="510" y="150" font-size="27" fill="#183449" font-weight="700" >surveys</text>
<text x="1150" y="149" font-size="20" fill="#506575" font-weight="400" text-anchor="end">问卷定义</text>
<text x="512" y="191" font-size="22" fill="#183449" font-weight="400" >owner_id / title / status / revision</text>
<rect x="512" y="210" width="634" height="165" rx="10" fill="#F2F7F9" stroke="#C7D5DE" stroke-width="1.5"/>
<text x="532" y="247" font-size="25" fill="#167D8D" font-weight="700" >questions[]</text>
<text x="1126" y="247" font-size="20" fill="#167D8D" font-weight="400" text-anchor="end">嵌入数组</text>
<text x="532" y="286" font-size="22" fill="#183449" font-weight="400" >id / type / title / required</text>
<text x="532" y="321" font-size="22" fill="#183449" font-weight="400" >options[] / validation / jumps[]</text>
<text x="532" y="354" font-size="20" fill="#506575" font-weight="400" >题目、选项与跳转规则一起获取</text>
<rect x="32" y="368" width="300" height="164" rx="10" fill="#FFFFFF" stroke="#C7D5DE" stroke-width="1.5"/>
<path d="M33 378Q33 369 42 369H322Q331 369 331 378V425H33Z" fill="#F2F7F9"/>
<text x="52" y="404" font-size="27" fill="#183449" font-weight="700" >sessions</text>
<text x="314" y="403" font-size="20" fill="#506575" font-weight="400" text-anchor="end">登录会话</text>
<text x="52" y="459" font-size="22" fill="#183449" font-weight="400" >_id：令牌摘要</text>
<text x="52" y="496" font-size="22" fill="#183449" font-weight="400" >user_id / expires_at</text>
<rect x="490" y="488" width="312" height="160" rx="10" fill="#FFFFFF" stroke="#C7D5DE" stroke-width="1.5"/>
<path d="M491 498Q491 489 500 489H792Q801 489 801 498V545H491Z" fill="#F2F7F9"/>
<text x="510" y="524" font-size="27" fill="#183449" font-weight="700" >fill_progress</text>
<text x="784" y="523" font-size="20" fill="#506575" font-weight="400" text-anchor="end">进度</text>
<text x="510" y="579" font-size="21" fill="#183449" font-weight="400" >answers{} / revision</text>
<text x="510" y="619" font-size="20" fill="#506575" font-weight="400" >已确认的答案，不计统计</text>
<rect x="850" y="488" width="318" height="160" rx="10" fill="#FFFFFF" stroke="#C7D5DE" stroke-width="1.5"/>
<path d="M851 498Q851 489 860 489H1158Q1167 489 1167 498V545H851Z" fill="#F2F7F9"/>
<text x="870" y="524" font-size="27" fill="#183449" font-weight="700" >responses</text>
<text x="1150" y="523" font-size="20" fill="#506575" font-weight="400" text-anchor="end">正式答卷</text>
<text x="870" y="579" font-size="22" fill="#183449" font-weight="400" >answers[] / path[]</text>
<text x="870" y="619" font-size="20" fill="#167D8D" font-weight="400" >逐份保存，作为统计来源</text>
<g fill="none" stroke="#506575" stroke-width="2" marker-end="url(#arrow)"><path d="M332 219H488"/><path d="M182 292V366"/><path d="M646 396V486"/><path d="M1009 396V486"/></g>
<text x="411" y="178" font-size="20" fill="#506575" font-weight="400" text-anchor="middle">owner_id</text>
<text x="411" y="205" font-size="19" fill="#506575" font-weight="400" text-anchor="middle">1:N 创建</text>
<text x="201" y="337" font-size="20" fill="#506575" font-weight="400" >user_id · 1:N</text>
<text x="662" y="449" font-size="20" fill="#506575" font-weight="400" >survey_id · 1:N</text>
<text x="1025" y="449" font-size="20" fill="#506575" font-weight="400" >survey_id</text>
<text x="1025" y="476" font-size="19" fill="#506575" font-weight="400" >1:N</text>
<line x1="32" y1="675" x2="1168" y2="675" stroke="#C7D5DE"/>
<text x="32" y="703" font-size="20" fill="#506575" font-weight="400" >实线表示 ID 引用；进度与正式答卷也通过 user_id 关联用户。</text>
<text x="32" y="731" font-size="20" fill="#506575" font-weight="400" >全部 _id 使用字符串；关系由后端校验，箭头不代表数据库外键或跨集合事务。</text></g></svg>
