<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 535" role="img" aria-labelledby="title desc">
  <title id="title">第一阶段五集合及嵌入结构</title>
  <desc id="desc">用户创建问卷，问卷内嵌题目及规则；会话、填写进度和正式答卷分别存储，通过字符串ID关联。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#526d85"/></marker></defs>
  <rect width="1000" height="535" rx="10" fill="#fbfcfe"/>
  <g stroke="#bac9d6" stroke-width="1.5">
    <rect x="30" y="46" width="240" height="113" rx="7" fill="#edf3f8"/>
    <rect x="370" y="46" width="600" height="213" rx="7" fill="#edf3f8"/>
    <rect x="392" y="124" width="556" height="109" rx="5" fill="white"/>
    <rect x="30" y="330" width="240" height="126" rx="7" fill="white"/>
    <rect x="370" y="330" width="280" height="126" rx="7" fill="white"/>
    <rect x="690" y="330" width="280" height="126" rx="7" fill="white"/>
  </g>
  <g font-family="Microsoft YaHei, sans-serif" fill="#20354a">
    <g font-size="21" font-weight="700">
      <text x="49" y="80">users</text><text x="390" y="80">surveys</text>
      <text x="49" y="365">sessions</text><text x="390" y="365">fill_progress</text><text x="710" y="365">responses</text>
    </g>
    <g font-size="17">
      <text x="49" y="112">账号、密码哈希</text><text x="49" y="140">注册时间</text>
      <text x="390" y="108">创建者、状态、设置、revision</text>
      <text x="412" y="151" font-weight="700">questions[]  嵌入题目</text>
      <text x="412" y="181">id / type / title / required</text>
      <text x="412" y="211">options[] / validation / jumps[]</text>
      <text x="49" y="398">令牌摘要、user_id</text><text x="49" y="429">过期时间</text>
      <text x="390" y="398">答案映射、版本</text><text x="390" y="429">已确认进度，不计统计</text>
      <text x="710" y="398">answers[] / path[]</text><text x="710" y="429">正式答卷，独立增长</text>
    </g>
  </g>
  <g fill="none" stroke="#526d85" stroke-width="2" marker-end="url(#arrow)">
    <path d="M270 103H370"/><path d="M150 159V330"/>
    <path d="M510 259V330"/><path d="M830 259V330"/>
  </g>
  <g font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#526d85">
    <text x="280" y="91">创建 1:N</text><text x="163" y="248">user_id</text>
    <text x="522" y="300">survey_id</text><text x="842" y="300">survey_id</text>
    <text x="30" y="494">进度和答卷也通过 user_id 关联用户；全部集合的 _id 为字符串。</text>
    <text x="30" y="519">实线表示业务关联，框内数组表示嵌入；关系约束由后端检查，并非数据库外键。</text>
  </g>
</svg>
