<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title"><title id="title">题库来源、问卷副本与正式答卷的关系；跨卷统计只读取本人问卷</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#728495"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,Microsoft YaHei,sans-serif" fill="#24364B"><rect x="20" y="20" width="360" height="335" rx="14" fill="#EBF6F3" stroke="#8CB9AE" stroke-width="1.5"/><text x="44" y="60" text-anchor="start" font-size="26" font-weight="400" fill="#253B3D">01  可复用来源</text><rect x="420" y="20" width="360" height="335" rx="14" fill="#F1F4F8" stroke="#A9B8CC" stroke-width="1.5"/><text x="444" y="60" text-anchor="start" font-size="26" font-weight="400" fill="#253B3D">02  问卷内容</text><rect x="820" y="20" width="360" height="335" rx="14" fill="#FBEFE8" stroke="#D4AA96" stroke-width="1.5"/><text x="844" y="60" text-anchor="start" font-size="26" font-weight="400" fill="#253B3D">03  正式答卷</text><rect x="40" y="85" width="320" height="95" rx="12" fill="white" stroke="#8CB9AE" stroke-width="1.5"/><text x="64" y="122" text-anchor="start" font-size="25" font-weight="400" fill="#253B3D">question_banks</text><text x="64" y="161" text-anchor="start" font-size="21" font-weight="400" fill="#253B3D">按所有者管理与分组</text><rect x="40" y="200" width="320" height="134" rx="12" fill="white" stroke="#8CB9AE" stroke-width="1.5"/><text x="64" y="237" text-anchor="start" font-size="25" font-weight="400" fill="#253B3D">library_questions</text><text x="64" y="276" text-anchor="start" font-size="21" font-weight="400" fill="#253B3D">工作稿 · 已提交版本</text><text x="64" y="307" text-anchor="start" font-size="21" font-weight="400" fill="#253B3D">共享名单 · 当前版本指针</text><rect x="440" y="85" width="320" height="249" rx="12" fill="white" stroke="#A9B8CC" stroke-width="1.5"/><text x="464" y="122" text-anchor="start" font-size="25" font-weight="400" fill="#253B3D">surveys.questions</text><text x="464" y="161" text-anchor="start" font-size="21" font-weight="400" fill="#253B3D">复制选定版本的题目定义</text><text x="464" y="192" text-anchor="start" font-size="21" font-weight="400" fill="#253B3D">source 记录来源与版本</text><text x="464" y="223" text-anchor="start" font-size="21" font-weight="400" fill="#253B3D">定义摘要用于区分改题</text><text x="464" y="254" text-anchor="start" font-size="21" font-weight="400" fill="#253B3D">发布后保持问卷内容不变</text><rect x="840" y="85" width="320" height="249" rx="12" fill="white" stroke="#D4AA96" stroke-width="1.5"/><text x="864" y="122" text-anchor="start" font-size="25" font-weight="400" fill="#253B3D">responses</text><text x="864" y="161" text-anchor="start" font-size="21" font-weight="400" fill="#253B3D">独立保存正式答卷</text><text x="864" y="192" text-anchor="start" font-size="21" font-weight="400" fill="#253B3D">关联问卷及本卷题号</text><text x="864" y="223" text-anchor="start" font-size="21" font-weight="400" fill="#253B3D">记录实际填写路径</text><text x="864" y="254" text-anchor="start" font-size="21" font-weight="400" fill="#253B3D">未提交进度不参与统计</text><path d="M360 267H440" fill="none" stroke="#6D8386" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="371.0" y="226" width="58" height="33" rx="4" fill="white" stroke="none" stroke-width="1.5"/><text x="400" y="250" text-anchor="middle" font-size="21" font-weight="400" fill="#253B3D">导入</text><path d="M760 267H840" fill="none" stroke="#6D8386" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="771.0" y="226" width="58" height="33" rx="4" fill="white" stroke="none" stroke-width="1.5"/><text x="800" y="250" text-anchor="middle" font-size="21" font-weight="400" fill="#253B3D">提交</text><path d="M600 355V388" fill="none" stroke="#6D8386" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M1000 355V388" fill="none" stroke="#6D8386" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="610.0" y="355" width="180" height="33" rx="4" fill="white" stroke="none" stroke-width="1.5"/><text x="700" y="379" text-anchor="middle" font-size="21" font-weight="400" fill="#253B3D">来源题定位</text><rect x="1010.0" y="355" width="160" height="33" rx="4" fill="white" stroke="none" stroke-width="1.5"/><text x="1090" y="379" text-anchor="middle" font-size="21" font-weight="400" fill="#253B3D">有效作答</text><rect x="420" y="390" width="760" height="120" rx="12" fill="#F2EFF8" stroke="#B6A6CC" stroke-width="1.5"/><text x="444" y="427" text-anchor="start" font-size="25" font-weight="400" fill="#253B3D">04  跨问卷统计 · 先校验问卷所有者</text><text x="444" y="466" text-anchor="start" font-size="21" font-weight="400" fill="#253B3D">按来源版本与实际定义分组，再汇总本人问卷中的有效作答</text><rect x="20" y="390" width="360" height="120" rx="12" fill="#EBF6F3" stroke="#8CB9AE" stroke-width="1.5"/><text x="44" y="427" text-anchor="start" font-size="25" font-weight="400" fill="#253B3D">保持旧问卷独立</text><text x="44" y="466" text-anchor="start" font-size="21" font-weight="400" fill="#253B3D">题库改版不反向覆盖副本</text></g></svg>