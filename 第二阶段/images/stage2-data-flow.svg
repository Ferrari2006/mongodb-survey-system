<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img"><title>题库来源与问卷快照关系</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#456878"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="Microsoft YaHei,SimSun,sans-serif" fill="#243b47"><rect x="20" y="25" width="270" height="160" rx="12" fill="#e5f1ed" stroke="#9cb5bd"/><text x="155.0" y="59" text-anchor="middle" font-size="24" font-weight="bold">题库与题目</text><text x="155.0" y="91" text-anchor="middle" font-size="21">question_banks</text><text x="155.0" y="119" text-anchor="middle" font-size="21">library_questions</text><text x="155.0" y="147" text-anchor="middle" font-size="21">工作稿与历史版本</text><rect x="345" y="25" width="270" height="160" rx="12" fill="#e8eef6" stroke="#9cb5bd"/><text x="480.0" y="59" text-anchor="middle" font-size="24" font-weight="bold">问卷内副本</text><text x="480.0" y="91" text-anchor="middle" font-size="21">surveys.questions</text><text x="480.0" y="119" text-anchor="middle" font-size="21">来源题与版本ID</text><text x="480.0" y="147" text-anchor="middle" font-size="21">独立题号与本卷跳转</text><rect x="670" y="25" width="270" height="160" rx="12" fill="#f9eee6" stroke="#9cb5bd"/><text x="805.0" y="59" text-anchor="middle" font-size="24" font-weight="bold">正式答卷</text><text x="805.0" y="91" text-anchor="middle" font-size="21">responses</text><text x="805.0" y="119" text-anchor="middle" font-size="21">保留原问卷题号</text><text x="805.0" y="147" text-anchor="middle" font-size="21">仅统计已提交内容</text><path d="M290 100 L345 100" stroke="#456878" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M615 100 L670 100" stroke="#456878" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="317" y="215" text-anchor="middle" font-size="20">指定版本复制</text><rect x="160" y="265" width="640" height="108" rx="12" fill="#eeeaf5" stroke="#9cb5bd"/><text x="480.0" y="299" text-an