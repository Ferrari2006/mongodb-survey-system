<svg xmlns="http://www.w3.org/2000/svg" width="960" height="425" viewBox="0 0 960 425" role="img"><title>题目版本分支与恢复示意</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#456878"/></marker></defs><rect width="960" height="425" fill="white"/><g font-family="Microsoft YaHei,SimSun,sans-serif" fill="#243b47"><rect x="25" y="20" width="250" height="110" rx="12" fill="#e5f1ed" stroke="#9cb5bd"/><text x="150.0" y="54" text-anchor="middle" font-size="24" font-weight="bold">第1版</text><text x="150.0" y="86" text-anchor="middle" font-size="21">初始内容</text><rect x="355" y="20" width="250" height="110" rx="12" fill="#e8eef6" stroke="#9cb5bd"/><text x="480.0" y="54" text-anchor="middle" font-size="24" font-weight="bold">第2版</text><text x="480.0" y="86" text-anchor="middle" font-size="21">父版本为第1版</text><rect x="685" y="20" width="250" height="110" rx="12" fill="#e8eef6" stroke="#9cb5bd"/><text x="810.0" y="54" text-anchor="middle" font-size="24" font-weight="bold">第3版</text><text x="810.0" y="86" text-anchor="middle" font-size="21">父版本为第2版</text><rect x="355" y="235" width="250" height="110" rx="12" fill="#eeeaf5" stroke="#9cb5bd"/><text x="480.0" y="269" text-anchor="middle" font-size="24" font-weight="bold">第4版</text><text x="480.0" y="301" text-anchor="middle" font-size="21">从第1版分支</text><rect x="685" y="235" width="250" height="110" rx="12" fill="#f9eee6" stroke="#9cb5bd"/><text x="810.0" y="269" text-anchor="middle" font-size="24" font-weight="bold">第5版</text><text x="810.0" y="301" text-anchor="middle" font-size="21">父版本为第4版</text><text x="810.0" y="329" text-anchor="middle" font-size="21">恢复来源为第1版</text><path d="M275 75 L355 75" stroke="#456878" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M605 75 L685 75" stroke="#456878" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M150 130 L355 290" stroke="#456878" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M605 290 L685 290" stroke="#456878" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="480" y="175" text-anchor="middle" font-size="21">每版保留内容与父版本；恢复追加记录</text><text x="480" y="395" text-anchor="middle" font-size="20">版本关系示意；各版本可分别导入不同问卷</text></g></svg>