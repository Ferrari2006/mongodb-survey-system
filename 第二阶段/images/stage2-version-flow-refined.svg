<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title"><title id="title">题目版本分支与恢复：父版本关系和恢复内容来源分别记录</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#728495"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei,SimHei,sans-serif" fill="#24364B"><rect x="20" y="20" width="1160" height="200" rx="14" fill="#F1F4F8" stroke="#A9B8CC" stroke-width="1.5"/><text x="44" y="59" text-anchor="start" font-size="26" font-weight="600" fill="#253B3D">01  历史版本 · 已提交内容保留</text><rect x="40" y="80" width="290" height="130" rx="12" fill="white" stroke="#A9B8CC" stroke-width="1.5"/><text x="64" y="117" text-anchor="start" font-size="25" font-weight="600" fill="#253B3D">版本 1</text><text x="64" y="156" text-anchor="start" font-size="21" font-weight="400" fill="#253B3D">首次提交的题目内容</text><text x="64" y="187" text-anchor="start" font-size="21" font-weight="400" fill="#253B3D">作为分支与恢复来源</text><rect x="455" y="80" width="290" height="130" rx="12" fill="white" stroke="#A9B8CC" stroke-width="1.5"/><text x="479" y="117" text-anchor="start" font-size="25" font-weight="600" fill="#253B3D">版本 2</text><text x="479" y="156" text-anchor="start" font-size="21" font-weight="400" fill="#253B3D">在版本 1 上修改</text><text x="479" y="187" text-anchor="start" font-size="21" font-weight="400" fill="#253B3D">parent_version → 1</text><rect x="870" y="80" width="290" height="130" rx="12" fill="white" stroke="#A9B8CC" stroke-width="1.5"/><text x="894" y="117" text-anchor="start" font-size="25" font-weight="600" fill="#253B3D">版本 3</text><text x="894" y="156" text-anchor="start" font-size="21" font-weight="400" fill="#253B3D">在版本 2 上修改</text><text x="894" y="187" text-anchor="start" font-size="21" font-weight="400" fill="#253B3D">parent_version → 2</text><path d="M330 145H455" fill="none" stroke="#6D8386" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M745 145H870" fill="none" stroke="#6D8386" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="420" y="267" width="760" height="150" rx="14" fill="#EBF6F3" stroke="#8CB9AE" stroke-width="1.5"/><rect x="440" y="280" width="320" height="124" rx="12" fill="white" stroke="#8CB9AE" stroke-width="1.5"/><text x="464" y="317" text-anchor="start" font-size="25" font-weight="600" fill="#253B3D">版本 4 · 从旧版分支</text><text x="464" y="356" text-anchor="start" font-size="21" font-weight="400" fill="#253B3D">重新选择版本 1 作为起点</text><text x="464" y="387" text-anchor="start" font-size="21" font-weight="400" fill="#253B3D">parent_version → 1</text><rect x="870" y="280" width="290" height="124" rx="12" fill="#FBEFE8" stroke="#D4AA96" stroke-width="1.5"/><text x="894" y="317" text-anchor="start" font-size="25" font-weight="600" fill="#253B3D">版本 5 · 恢复为新版本</text><text x="894" y="356" text-anchor="start" font-size="21" font-weight="400" fill="#253B3D">parent_version → 4</text><text x="894" y="387" text-anchor="start" font-size="21" font-weight="400" fill="#253B3D">restored_from → 1</text><path d="M185 210V240H600V280" fill="none" stroke="#6D8386" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="470.0" y="226" width="260" height="33" rx="4" fill="white" stroke="none" stroke-width="1.5"/><text x="600" y="250" text-anchor="middle" font-size="21" font-weight="400" fill="#253B3D">从版本 1 创建分支</text><path d="M760 342H870" fill="none" stroke="#6D8386" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="865.0" y="226" width="300" height="33" rx="4" fill="white" stroke="none" stroke-width="1.5"/><text x="1015" y="250" text-anchor="middle" font-size="21" font-weight="400" fill="#253B3D">在当前版本 4 上执行恢复</text><path d="M185 210V446H1015V404" fill="none" stroke="#6D8386" stroke-width="1.7" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="280.0" y="428" width="660" height="33" rx="4" fill="white" stroke="none" stroke-width="1.5"/><text x="610" y="452" text-anchor="middle" font-size="21" font-weight="400" fill="#253B3D">虚线：恢复内容来自版本 1；原历史不被覆盖</text><text x="600" y="490" text-anchor="middle" font-size="21" font-weight="400" fill="#253B3D">实线表示父版本关系；版本序号按提交次序递增，不代表只能顺序修改。</text></g></svg>